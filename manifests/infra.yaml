apiVersion: v1
kind: Namespace
metadata:
  name: infra
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-response
  namespace: infra
data:
  index.html: "infra-ok"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-nginx
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-nginx
  template:
    metadata:
      labels:
        app: infra-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.0
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      volumes:
      - name: html
        configMap:
          name: infra-response
---
apiVersion: v1
kind: Service
metadata:
  name: infra-nginx
  namespace: infra
spec:
  selector:
    app: infra-nginx
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
